# cargo-deny configuration. Run: `cargo deny check`.

[graph]
# Dependencies that only matter on some targets are still checked.
all-features = false

[advisories]
# Fail on known vulnerabilities and unmaintained crates reachable from the workspace.
version = 2
yanked = "deny"
ignore = [
    # Add RUSTSEC ids here only with a written reason and an expiry review.
    # proc-macro-error2 is unmaintained (no vulnerability). It is a build-time proc-macro dependency of
    # hdf5-metno-derive (HDF5 bindings, behind the optional `hdf5` feature), which has no maintained
    # alternative today. Review when hdf5-metno moves off it.
    { id = "RUSTSEC-2026-0173", reason = "transitive, build-time only, via hdf5-metno-derive; no vulnerability" },
]

[licenses]
# Everything must be compatible with distributing this workspace under Apache-2.0.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    # webpki-roots ships the Mozilla CA bundle under this licence.
    "CDLA-Permissive-2.0",
    # MPL-2.0 is file-level copyleft; allowed only as an unmodified dependency.
    "MPL-2.0",
]
confidence-threshold = 0.8
# TODO(verify): run `cargo deny check licenses` on the assembled workspace and add any
# licence it reports that is Apache-2.0-compatible (for example the `ring` clarification,
# hdf5-metno and its build helpers, proj4rs, spade); trim entries that stay unused.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The generated crates are path dependencies inside the workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
