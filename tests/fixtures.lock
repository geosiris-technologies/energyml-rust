# Pinned reference packages, downloaded in CI and on demand - never committed.
#
# Each entry names the origin repository, the exact commit, the path in it, the
# SHA-256 and size of the file at that commit, and the licence of the source.
# `scripts/fetch-fixtures.py` downloads every file into `target/fixtures/<dir>/`
# (or `--dir`), verifies the digest and fails loudly on any mismatch.
# No test goes to the network: tests read the directory the script filled.
#
# To bump a pin: change `commit`, run `python scripts/fetch-fixtures.py --update`
# (prints the new digests; review them), then commit the lock.
# Fetched 2026-10-12 from the then-current head of each default branch.

schema = 1

[sources.fesapi-examples]
repo = "geosiris-technologies/energyml-python"
branch = "main"
commit = "793e96c968dc63ba7f51558be1ad72d95fe3bc6f"
license = "Apache-2.0"
note = "Packages written by the fesapi example program (RESQML 2.0.1 and 2.2). The fesapi repository itself versions no .epc file."

[sources.resqpy]
repo = "bp/resqpy"
branch = "master"
commit = "544d8b2a32a8410d22d3eecc9d845b4aa1f9ffe5"
license = "MIT"
note = "Packages written by resqpy (RESQML 2.0.1)."

