# Generated by enyrust/split/assemble.py - edit the manifest or the overlay, not this file.
[workspace]
resolver = "3"
members = [
    "crates/energyml",
    "crates/energyml-core",
    "crates/energyml-derive",
    "crates/energyml-schemas",
    "crates/energyml-storage",
    "crates/energyml-domain",
    "crates/energyml-geometry",
    "crates/energyml-export",
    "crates/energyml-mcp",
    "crates/energyml-proj",
    "crates/energyml-cache",
    "crates/energyml-rules",
    "crates/energyml-log",
    "crates/energyml-sheet",
    "crates/energyml-section",
    "crates/energyml-analysis",
    "crates/energyml-geostat",
    "crates/energyml-build",
    "crates/energyml-build-derive",
    "crates/energyml-providers",
    "crates/energyml-cli",
    "crates/energyml-python",
    "crates/energyml-tests",
    "crates/energyml-roundtrip",
    "crates/generated/*",
]

[workspace.package]
version = "0.2.0-alpha.3"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/geosiris-technologies/energyml-rust"

# Speed-first release profile: fat LTO and one codegen unit also shrink the wasm module.
[profile.release]
lto = "fat"
codegen-units = 1

# What is distributed outside wasm (Python wheels, CLI archives): thin LTO, which
# a GitHub runner can link without running out of memory.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16

# Backtraces keep file and line; full debug info cost ~570 MB per test binary.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
tracing = "0.1"
energyml-log = { path = "crates/energyml-log", version = "0.2.0-alpha.3" }
energyml-core = { path = "crates/energyml-core", version = "0.2.0-alpha.3" }
retp-proto = { path = "../retp/crates/retp-proto", version = "0.1.0" }
retp-avro = { path = "../retp/crates/retp-avro", version = "0.1.0" }
retp-client = { path = "../retp/crates/retp-client", version = "0.1.0" }
energyml-etp-store = { path = "../retp/crates/energyml-etp-store", version = "0.1.0" }
retp-derive = { path = "../retp/crates/retp-derive", version = "0.1.0" }
retp-types = { path = "../retp/crates/generated/retp-types", version = "0.1.0" }
energyml-derive = { path = "crates/energyml-derive", version = "0.2.0-alpha.3" }
