[package]
name = "energyml-export"
description = "Writes EnergyML geometry out to interchange formats, through a registry new formats plug into."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Spelled out rather than inherited: wasm-pack parses the manifests of a
# WebAssembly front end's path dependencies before running wasm-opt, and
# does not resolve workspace inheritance - `license.workspace = true` reaches
# it as a table where it wants a string, and the wasm build dies *after*
# writing the module, leaving a usable artefact and an unread exit code.
license = "Apache-2.0"
repository.workspace = true
keywords = ["energyml", "export", "obj", "geojson", "vtk"]
categories = ["encoding", "science::geo"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/energyml-export"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]

[dependencies]
energyml-core = { workspace = true }
energyml-domain = { path = "../energyml-domain", version = "0.1.2" }
energyml-geometry = { path = "../energyml-geometry", version = "0.1.2" }
thiserror = "2.0"

[dev-dependencies]
energyml-storage = { path = "../energyml-storage" }
# Tests only, and it has to stay that way: the point of `Reprojector` is that
# this crate does not know which geodesy library sits behind it. Here it is the
# real one, so the corpus goes out through the path an application uses.
energyml-proj = { path = "../energyml-proj" }
energyml-eml-2-0 = { path = "../generated/energyml-eml-2-0" }
energyml-eml-2-3 = { path = "../generated/energyml-eml-2-3" }
energyml-resqml-2-0-1 = { path = "../generated/energyml-resqml-2-0-1" }
energyml-resqml-2-2 = { path = "../generated/energyml-resqml-2-2" }
energyml-witsml-2-1 = { path = "../generated/energyml-witsml-2-1" }
# Every schema version the workspace generates, in one line - see
# `energyml-schemas` for why the list lives in exactly one place.
energyml-schemas = { path = "../energyml-schemas", features = ["all"] }
# Tests only, and for one job: parsing the GeoJSON this crate writes. A
# hand-rolled writer is exactly where a NaN, a trailing comma or an unescaped
# quote gets in, and only a real parser notices all three.
serde_json = "1.0"

[features]
default = []
# Tests on the private real-file corpus under testdata/ - real-file campaign, run privately. Off by default.
private-corpus = []
hdf5 = ["energyml-geometry/hdf5", "energyml-storage/hdf5"]

[lints.rust]
missing_docs = "warn"

# docs.rs builds on Linux with no native HDF5: only features needing no native library are listed.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
