[package]
name = "energyml-build-derive"
description = "Derive macros for energyml-build operations: typed parameters, choices and inputs, declared once."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Spelled out rather than inherited, for the reason `energyml-derive` gives:
# wasm-pack reads the manifests of path dependencies without resolving
# workspace inheritance.
license = "Apache-2.0"
repository.workspace = true
keywords = ["energyml", "derive", "proc-macro", "parameters", "geoscience"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/energyml-build-derive"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"

# docs.rs builds on Linux with no native HDF5: every feature builds there.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
