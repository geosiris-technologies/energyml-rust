[package]
name = "energyml-domain"
description = "Version-agnostic EnergyML concepts: units of measure and coordinate reference systems."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Spelled out rather than inherited: wasm-pack parses the manifests of a
# WebAssembly front end's path dependencies before running wasm-opt, and
# does not resolve workspace inheritance - `license.workspace = true` reaches
# it as a table where it wants a string, and the wasm build dies *after*
# writing the module, leaving a usable artefact and an unread exit code.
license = "Apache-2.0"
repository.workspace = true
keywords = ["energyml", "units", "crs", "epsg", "resqml"]
categories = ["science::geo", "parser-implementations"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/energyml-domain"
include = ["src/**", "data/**", "build.rs", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]
# One test binary, `tests/main.rs` - see its doc.
autotests = false

[dependencies]
energyml-core = { workspace = true }
# Only for the `ObjectSource` impl over `EpcStore`: the orphan rule puts it
# either here or in the storage crate, and storage must not know about CRS.
energyml-storage = { path = "../energyml-storage", version = "0.2.0-alpha.4" }
thiserror = "2.0"
# The metadata spec is a JSON file a person writes; parsing it by hand is
# exactly the kind of thing that goes subtly wrong.
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[dev-dependencies]
# `tests/prefetch.rs` drives the asynchronous `EnergymlStorage` from a
# synchronous test; the crate itself never blocks on a future.
futures-executor = "0.3"
async-trait = "0.1"
energyml-eml-2-0 = { path = "../generated/energyml-eml-2-0" }
energyml-eml-2-3 = { path = "../generated/energyml-eml-2-3" }
energyml-resqml-2-0-1 = { path = "../generated/energyml-resqml-2-0-1" }
energyml-resqml-2-2 = { path = "../generated/energyml-resqml-2-2" }
energyml-witsml-2-1 = { path = "../generated/energyml-witsml-2-1" }
# `tests/series.rs` builds PRODML time series and flow tests by hand.
energyml-prodml-2-3 = { path = "../generated/energyml-prodml-2-3" }
# Every schema version the workspace generates, in one line - see
# `energyml-schemas` for why the list lives in exactly one place.
energyml-schemas = { path = "../energyml-schemas", features = ["all"] }

[features]
default = []
# Tests on the private real-file corpus under testdata/ - real-file campaign, run privately. Off by default.
private-corpus = []
# Only the tests need it: the crate itself never touches a file directly.
hdf5 = ["energyml-storage/hdf5"]

[lints.rust]
missing_docs = "warn"

[[test]]
name = "domain"
path = "tests/main.rs"

# docs.rs builds on Linux with no native HDF5: only features needing no native library are listed.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
