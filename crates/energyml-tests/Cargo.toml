[package]
name = "energyml-tests"
description = "End-to-end tests over the generated EnergyML crates, and the cross-audit that confronts the readers with each other."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# One test binary, `tests/main.rs` - see its doc.
autotests = false

[dev-dependencies]
energyml-core = { workspace = true }
energyml-eml-2-0 = { path = "../generated/energyml-eml-2-0", version = "0.1.0" }
energyml-eml-2-3 = { path = "../generated/energyml-eml-2-3", version = "0.1.0" }
energyml-resqml-2-0-1 = { path = "../generated/energyml-resqml-2-0-1", version = "0.1.0" }
energyml-resqml-2-2 = { path = "../generated/energyml-resqml-2-2", version = "0.1.0" }
# For the two XSD constructs the generator used to drop: an optional
# `<xs:sequence>` (witsml `TorqueStatistics`) and `mixed="true"` (eml
# `PhoneNumberStruct`). Both are real declarations, so the tests read the real
# generated types rather than a fixture.
energyml-witsml-2-0 = { path = "../generated/energyml-witsml-2-0", version = "0.1.0" }
# `tests/crossaudit.rs` is the one suite here that spans the whole stack: it
# exists to confront the storage, domain and geometry layers with each other and
# with the bytes on disk, which needs all three in one place.
energyml-storage = { path = "../energyml-storage", version = "0.1.0" }
energyml-domain = { path = "../energyml-domain", version = "0.1.0" }
energyml-geometry = { path = "../energyml-geometry", version = "0.1.0" }
energyml-schemas = { path = "../energyml-schemas", version = "0.1.0", features = ["all"] }
# The cross-audit derives packages from the corpus - one with elements removed,
# one with a value corrupted - because a ladder whose three rungs are all empty
# proves nothing about the order of its rungs.
zip = { version = "7", default-features = false, features = ["deflate"] }
# `introspection.rs` reads a value into a field through the JSON door, which is
# how an editor reaches it - the refusal being tested is one a front end provokes.
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[features]
default = []
# Tests on the private real-file corpus under testdata/ - real-file campaign, private. Off by default.
private-corpus = []
# Read arrays from HDF5 files, which is where most of the corpus's numbers are.
hdf5 = ["energyml-storage/hdf5", "energyml-geometry/hdf5", "energyml-domain/hdf5"]

[[test]]
name = "tests"
path = "tests/main.rs"
