[package]
name = "energyml-sheet"
description = "A drilling sheet: a well's 2D cross-section, laid out in Rust and written as SVG."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["energyml", "svg", "well", "drilling", "geoscience"]
categories = ["visualization", "science::geo"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/energyml-sheet"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]

[dependencies]
# `energyml_core::value::Reflect` and friends: `read` walks a frame and its
# properties through reflection, the same way every other version-agnostic
# reader in this workspace does.
energyml-core = { workspace = true }
# `well_strata::Strata`, `property::read`, `property_kind::Resolver`,
# `color::GraphicalSet`, and the `ObjectSource`/`ArraySource` traits `read`
# is written against.
energyml-domain = { path = "../energyml-domain", version = "0.3.0" }
# `ObjectSummary` only - the package's own listing `read` needs to find a
# frame's properties and colour sets (nothing in a representation names
# them). No native dependency: `energyml-domain` already depends on this
# crate for the same `ObjectSource` reason, with its default (no `hdf5`)
# features, and `read` asks for nothing more - wasm stays a hard requirement.
energyml-storage = { path = "../energyml-storage", version = "0.3.0" }
thiserror = "2.0"

[dev-dependencies]
# `tests/svg.rs` re-reads the written SVG with an XML parser that is not this
# crate's own code (two independent readings of one fact, ADR-0011) -
# the same version `energyml-storage` already resolves in the workspace, so
# this adds no new dependency to `Cargo.lock`.
quick-xml = "0.41"
# `tests/read.rs` builds a frame, its properties and a lookup table in
# memory, after the specification - the same pattern
# `crates/energyml-domain/tests/well_strata.rs` uses.
energyml-eml-2-3 = { path = "../generated/energyml-eml-2-3" }
energyml-resqml-2-2 = { path = "../generated/energyml-resqml-2-2" }
# A package opened for real - every release's schema in one registry - for a
# test that draws a sheet from a file of `testdata/` or of the front end's
# examples, and says so when the file is absent.
energyml-schemas = { path = "../energyml-schemas", features = ["all"] }

[lints.rust]
missing_docs = "warn"

# docs.rs builds on Linux with no native HDF5: every feature builds there.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
