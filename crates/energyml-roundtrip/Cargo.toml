[package]
name = "energyml-roundtrip"
description = "Reads real EnergyML documents, writes them back, and reports anything lost."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
quick-xml = "0.41"
zip = { version = "7", default-features = false, features = ["deflate"] }

energyml-core = { workspace = true }
energyml-schemas = { path = "../energyml-schemas", version = "0.2.0-alpha.3", features = ["all"] }

[lints.rust]
missing_docs = "warn"
