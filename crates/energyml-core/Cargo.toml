[package]
name = "energyml-core"
description = "Runtime support for generated EnergyML (eml/resqml/witsml/prodml) crates: XML/JSON serialization, reflection, validation and identifiers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Spelled out rather than inherited: wasm-pack parses the manifests of a
# WebAssembly front end's path dependencies before running wasm-opt, and
# does not resolve workspace inheritance — `license.workspace = true` reaches
# it as a table where it wants a string, and the wasm build dies *after*
# writing the module, leaving a usable artefact and an unread exit code.
license = "Apache-2.0"
repository.workspace = true
keywords = ["energyml", "resqml", "witsml", "prodml", "xml"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/energyml-core"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]

[dependencies]
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` is not optional in spirit: without it serde_json's fast
# float parser is off by one ULP on some 17-digit doubles — `248.49637958325286`
# reads back as `248.4963795832529` — so a JSON round trip silently moves
# coordinates. Found on `s_bend.epc`.
serde_json = { version = "1.0", features = ["float_roundtrip"], optional = true }
thiserror = "2.0"
regex = "1.11"
energyml-derive = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[features]
default = ["json", "derive"]
json = ["dep:serde_json"]
derive = ["dep:energyml-derive"]

[lints.rust]
missing_docs = "warn"

# docs.rs builds on Linux without a native HDF5; only the features that need no native library are listed.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
