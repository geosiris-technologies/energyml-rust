[package]
name = "energyml"
description = "The EnergyML library in one dependency: read, write and compute RESQML, WITSML, PRODML and EML data. Re-exports the energyml-* crates under short module names."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["energyml", "resqml", "witsml", "prodml", "geoscience"]
categories = ["science::geo", "parser-implementations"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/energyml"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]

# **A library target named `energyml`, next to the binary of the same name** in
# `energyml-cli`. The library is an rlib, which writes no `.pdb`, so the
# `LNK1201` that `energyml-python` once hit (two targets, one program database)
# does not apply; `cargo doc` would, though, write both to `target/doc/energyml/`,
# which is why the binary of `energyml-cli` sets `doc = false`.

# Only the public library crates. The versions are the workspace's: they are
# bumped together.
[dependencies]
energyml-core = { workspace = true }
# `default-features = false`: the façade asks for no schema version by itself;
# the features below forward to the ones the application names.
energyml-schemas = { path = "../energyml-schemas", version = "0.2.0-alpha.2", default-features = false }
energyml-storage = { path = "../energyml-storage", version = "0.2.0-alpha.2" }
energyml-domain = { path = "../energyml-domain", version = "0.2.0-alpha.2" }
energyml-geometry = { path = "../energyml-geometry", version = "0.2.0-alpha.2" }
energyml-export = { path = "../energyml-export", version = "0.2.0-alpha.2" }
energyml-proj = { path = "../energyml-proj", version = "0.2.0-alpha.2" }
energyml-cache = { path = "../energyml-cache", version = "0.2.0-alpha.2" }
energyml-analysis = { path = "../energyml-analysis", version = "0.2.0-alpha.2" }
energyml-geostat = { path = "../energyml-geostat", version = "0.2.0-alpha.2" }
energyml-build = { path = "../energyml-build", version = "0.2.0-alpha.2", optional = true }
energyml-providers = { path = "../energyml-providers", version = "0.2.0-alpha.2", optional = true }
energyml-rules = { path = "../energyml-rules", version = "0.2.0-alpha.2" }
energyml-sheet = { path = "../energyml-sheet", version = "0.2.0-alpha.2" }
energyml-section = { path = "../energyml-section", version = "0.2.0-alpha.2" }
energyml-log = { workspace = true }

[features]
default = []

# **Schema versions: one feature per version, forwarded to `energyml-schemas`**,
# which holds the optional dependencies. `resqml22` alone brings RESQML 2.2 and
# the EML 2.3 it is built on - no 2.0.1, no WITSML, no PRODML. With none of
# them, the registry is empty and a lookup of a shipped version is a named
# refusal ("RESQML 2.2 is not compiled in: enable the `resqml22` feature").
eml20 = ["energyml-schemas/eml20"]
eml21 = ["energyml-schemas/eml21"]
eml22 = ["energyml-schemas/eml22"]
eml23 = ["energyml-schemas/eml23"]
resqml20 = ["energyml-schemas/resqml20"]
resqml22 = ["energyml-schemas/resqml22"]
resqml22dev3 = ["energyml-schemas/resqml22dev3"]
witsml20 = ["energyml-schemas/witsml20"]
witsml21 = ["energyml-schemas/witsml21"]
prodml20 = ["energyml-schemas/prodml20"]
prodml22 = ["energyml-schemas/prodml22"]
prodml23 = ["energyml-schemas/prodml23"]
# The families, and everything.
eml = ["energyml-schemas/eml"]
resqml = ["energyml-schemas/resqml"]
witsml = ["energyml-schemas/witsml"]
prodml = ["energyml-schemas/prodml"]
all = ["energyml-schemas/all"]

# `energyml::build` writes RESQML 2.2, EML 2.3, WITSML 2.1 and PRODML 2.3, so
# the feature turns on exactly those versions in the registry.
build = ["dep:energyml-build", "resqml22", "eml23", "witsml21", "prodml23"]
# `energyml::providers` turns the answers of public APIs into what `build` makes.
providers = ["dep:energyml-providers", "build"]

# Read and write the arrays of an EPC in HDF5. Needs the HDF5 C library at build time.
hdf5 = ["energyml-storage/hdf5"]
# Render a section view to PNG (pure Rust, no system font).
png = ["energyml-section/png"]

[dev-dependencies]
# `tests/narrow.rs` fabricates a package in memory; the version the storage
# crate reads with, so the two never disagree about a zip.
zip = { version = "7", default-features = false, features = ["deflate"] }

[lints.rust]
missing_docs = "warn"

# docs.rs builds on Linux with no native HDF5: only features needing no native library are listed.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
features = ["all", "build", "providers", "png"]
