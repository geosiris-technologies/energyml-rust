name: Bug report
description: Something is wrong, crashes, or reads/writes a package incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, do **not** use this form: see SECURITY.md.
        Defects in generated code (`crates/generated/`) are welcome here as issues, not as pull requests.
  - type: dropdown
    id: face
    attributes:
      label: Where did you see it?
      options: [Rust library, Python package, Command line, Generated crate, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate, wheel or `energyml --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Windows 11 x86_64 / macOS 15 arm64 / Ubuntu 24.04 x86_64"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A command or a few lines of code. If a package triggers it, say how to obtain it (a public link, or the reference model Lutetia); do not attach confidential data.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output, error message or log
      description: "For the CLI, `--log debug` helps."
      render: shell
