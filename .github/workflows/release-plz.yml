name: release-plz

# On every push to main: open (or update) a release pull request with the version
# bumps and changelogs; once it is merged, publish to crates.io and tag.
# On every push to dev: publish a crate whose version is not yet on crates.io (a
# pre-release such as 0.2.0-alpha.1, set by hand in Cargo.toml) and tag it; no
# release pull request, no CLI binaries, no image.
# Publication uses crates.io trusted publishing (OIDC): no token is stored. The
# publish job runs in the `crates-io` environment, which crates.io checks (each
# crate's trusted publisher names it) and which only `main` and `dev` may deploy to.
#
# A crate new to crates.io needs one publication with an API token first (trusted
# publishing is configured on a crate that exists): see docs/releasing.md.
#
# A GitHub release (event `release: published`) publishes too, once its tag is
# checked against the manifests. The repository variable RELEASE_PLZ_PUBLISH
# chooses: 'true' publishes on a merge to main or dev and on a release; 'release'
# on a release only (the release pull request still prepares versions and
# changelogs); unset, nothing is published. The `crates-io` environment accepts
# the branches main and dev and the tags `v*` and `*-v*`.
on:
  push:
    branches: [main, dev]
  release:
    types: [published]

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Opens the release pull request (versions, changelogs, semver check).
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The semver check builds each changed crate's rustdoc with all its features,
      # `hdf5` among them, which links the HDF5 C library.
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes crates whose version is not yet on crates.io, and creates the tags.
  release:
    name: release-plz release
    runs-on: ubuntu-latest
    # Only from main or dev (or a release checked below), and only once publishing is
    # switched on in the repository's variables: creating the repository must not
    # publish anything.
    if: >-
      ${{ (github.event_name != 'release' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && vars.RELEASE_PLZ_PUBLISH == 'true')
       || (github.event_name == 'release' && (vars.RELEASE_PLZ_PUBLISH == 'true' || vars.RELEASE_PLZ_PUBLISH == 'release')) }}
    environment: crates-io
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
      actions: write # start the tag workflows below (workflow_dispatch)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # A GitHub release publishes what its tag names, from the history of main or dev
      # only: `vX.Y.Z` (the workspace version) or `<crate>-vX.Y.Z`. Anything else is
      # refused before a single crate leaves.
      - name: Check the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --quiet origin main
          git fetch --quiet origin dev 2>/dev/null || true
          on_branch=no
          for b in main dev; do
            if git rev-parse -q --verify "origin/$b" >/dev/null && git merge-base --is-ancestor HEAD "origin/$b"; then
              on_branch=yes
            fi
          done
          if [ "$on_branch" != yes ]; then
            echo "::error::release $TAG: its commit is on neither main nor dev"
            exit 1
          fi
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "v\(.version)", "\(.name)-v\(.version)"' \
            | sort -u > versions.txt
          if ! grep -qxF "$TAG" versions.txt; then
            echo "::error::release $TAG names no version of the manifests (expected v<workspace version> or <crate>-v<version>)"
            exit 1
          fi
          rm versions.txt
      - id: rp
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: the action exchanges the OIDC token for a short-lived one.

      # Tags pushed with GITHUB_TOKEN start no workflow (push events), but
      # workflow_dispatch started with GITHUB_TOKEN does run. So the release job
      # itself starts, on the new tag, the two workflows that listen for it. No
      # extra secret; the publish gates stay in those workflows (IMAGE_PUBLISH)
      # and in this job (RELEASE_PLZ_PUBLISH).
      - name: Start the tag workflows
        # Not from dev nor a GitHub pre-release: a pre-release must not become the `latest` image.
        if: ${{ github.ref != 'refs/heads/dev' && !github.event.release.prerelease && steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ steps.rp.outputs.releases }}
        run: |
          for tag in $(jq -r '.[].tag' <<< "$RELEASES" | grep '^energyml-cli-v' || true); do
            gh workflow run release-cli.yml --ref "$tag"
            gh workflow run docker.yml --ref "$tag"
          done
