name: release-plz

# Versions, changelogs and crates.io, the GitHub way: nothing is published by a push.
#  - push to main: open (or update) the release pull request - the version bumps and
#    the CHANGELOG entries, written from conventional commits. Merging it publishes
#    nothing.
#  - a published GitHub release (event `release: published`): publish to crates.io
#    every crate whose version is not there yet, and tag each one `<crate>-vX.Y.Z`.
#    A final release `vX.Y.Z` is made on main; a pre-release `vX.Y.Z-alpha.N`, marked
#    as a pre-release, on dev (its version is set by hand there, see
#    docs/releasing.md). release-cli.yml, docker.yml and python.yml listen for the
#    same release and attach the CLI archives, push the image and publish the wheels.
# Publication uses crates.io trusted publishing (OIDC): no token is stored. The
# publish job runs in the `crates-io` environment, which crates.io checks (each
# crate's trusted publisher names it).
#
# A crate new to crates.io needs one publication with an API token first (trusted
# publishing is configured on a crate that exists): see docs/releasing.md.
#
# The repository variable RELEASE_PLZ_PUBLISH is the switch: 'release' publishes on
# a GitHub release; unset (or anything else), nothing is published.
on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Opens the release pull request (versions, changelogs, semver check).
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with GITHUB_TOKEN starts its checks only once a
      # maintainer approves them. Opened by the release bot (a GitHub App: variable
      # RELEASE_BOT_CLIENT_ID, secret RELEASE_BOT_PRIVATE_KEY), its checks run like
      # those of any other pull request. Without the app, GITHUB_TOKEN.
      - id: bot
        if: ${{ vars.RELEASE_BOT_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The semver check builds each changed crate's rustdoc with all its features,
      # `hdf5` among them, which links the HDF5 C library.
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}

  # Publishes crates whose version is not yet on crates.io, and creates the tags.
  release:
    name: release-plz release
    runs-on: ubuntu-latest
    # Only on a published GitHub release (checked below), and only once publishing is
    # switched on in the repository's variables: creating the repository must not
    # publish anything.
    if: ${{ github.event_name == 'release' && vars.RELEASE_PLZ_PUBLISH == 'release' }}
    environment: crates-io
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # A GitHub release publishes what its tag names: `vX.Y.Z` (the workspace version)
      # or `<crate>-vX.Y.Z`. A final release comes from the history of main; a release
      # marked as a pre-release from main or dev. Anything else is refused before a
      # single crate leaves.
      - name: Check the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git fetch --quiet origin main
          git fetch --quiet origin dev 2>/dev/null || true
          branches=main
          if [ "$PRERELEASE" = true ]; then branches="main dev"; fi
          on_branch=no
          for b in $branches; do
            if git rev-parse -q --verify "origin/$b" >/dev/null && git merge-base --is-ancestor HEAD "origin/$b"; then
              on_branch=yes
            fi
          done
          if [ "$on_branch" != yes ]; then
            echo "::error::release $TAG: its commit is not on $branches (a release from dev must be marked as a pre-release)"
            exit 1
          fi
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "v\(.version)", "\(.name)-v\(.version)"' \
            | sort -u > versions.txt
          if ! grep -qxF "$TAG" versions.txt; then
            echo "::error::release $TAG names no version of the manifests (expected v<workspace version> or <crate>-v<version>)"
            exit 1
          fi
          rm versions.txt
      - id: rp
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: the action exchanges the OIDC token for a short-lived one.
