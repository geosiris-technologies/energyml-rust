name: release-cli

# Builds the `energyml` command for the supported targets when a tag
# `energyml-cli-v*` is pushed (the tag release-plz creates), and attaches one
# archive per target to the GitHub release.
#
# Later option: replace this matrix with cargo-dist (installers, Homebrew tap,
# GHCR image) - see dist-workspace.toml once it exists.
on:
  push:
    tags:
      - "energyml-cli-v*"
  # Started by release-plz.yml on the new tag (a tag pushed with GITHUB_TOKEN
  # starts no workflow). Must be run with `--ref <tag>`: the archive names and
  # the release come from the ref.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    # A manual run on a branch would build archives named after the branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `features: hdf5` builds with HDF5 support; a target without it still reads
          # and writes packages, and refuses by name to read an array (FeatureNotEnabled).
          # TODO(verify): HDF5 is meant to be linked statically (hdf5-metno-src, needs cmake);
          # no workspace feature exposes it yet, so these builds use the system HDF5.
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-22.04,     features: hdf5, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-24.04-arm, features: hdf5, ext: tar.gz }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-22.04,     features: "",   ext: tar.gz, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04,     features: "",   ext: tar.gz, musl: true }
          - { target: aarch64-apple-darwin,       os: macos-latest,     features: hdf5, ext: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-latest,     features: "",   ext: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   features: hdf5, ext: zip }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest,   features: "",   ext: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # HDF5 development files, where the build uses them.
      - name: Install HDF5 (Linux)
        if: matrix.features == 'hdf5' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev cmake
      - name: Install HDF5 (macOS)
        if: matrix.features == 'hdf5' && runner.os == 'macOS'
        run: brew install hdf5 cmake
      # TODO(verify): HDF5 on Windows (the MSVC build of HDF5 1.14.x via vcpkg or a prebuilt package).
      - name: Install cross (musl and foreign-architecture Linux targets)
        if: matrix.musl
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          feat=""
          if [ -n "${{ matrix.features }}" ]; then feat="--features ${{ matrix.features }}"; fi
          if [ "${{ matrix.musl }}" = "true" ]; then
            cross build --release --locked -p energyml-cli --target ${{ matrix.target }} $feat
          else
            cargo build --release --locked -p energyml-cli --target ${{ matrix.target }} $feat
          fi
      - name: Package
        shell: bash
        run: |
          name="energyml-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          bin=energyml
          if [ "${{ runner.os }}" = "Windows" ]; then bin=energyml.exe; fi
          cp "target/${{ matrix.target }}/release/$bin" "$name/"
          cp LICENSE NOTICE README.md "$name/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Attaches every archive to the GitHub release of the tag.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
