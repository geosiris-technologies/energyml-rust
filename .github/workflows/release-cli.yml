name: release-cli

# Builds the `energyml` command for the supported targets and attaches one archive
# per target to a GitHub release: the release `vX.Y.Z` (or the pre-release
# `vX.Y.Z-alpha.N`) a maintainer publishes, the one that publishes everything (see
# docs/releasing.md). A manual run (`gh workflow run release-cli.yml --ref <tag>`)
# rebuilds the archives of an existing release.
#
# Later option: replace this matrix with cargo-dist (installers, Homebrew tap,
# GHCR image) - see dist-workspace.toml once it exists.
on:
  release:
    types: [published]
  # Must be run with `--ref <tag>`: the archive names and the release come from the ref.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # A manual run on a branch would build archives named after the branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version of the code
        shell: bash
        run: |
          # The tag must name the version of the code it builds: a release `vX.Y.Z` created on a
          # commit still at another version (14/10/2026: v0.1.2 on a main at 0.1.1) would
          # publish one version under the name of another. crates.io and PyPI refuse it; so here.
          crate=$(python3 - <<'EOF'
          import tomllib
          cli = tomllib.load(open("crates/energyml-cli/Cargo.toml", "rb"))["package"]["version"]
          if isinstance(cli, dict):
              cli = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(cli)
          EOF
          )
          tag="${GITHUB_REF_NAME#energyml-cli-}"
          tag="${tag#v}"
          echo "tag=$tag energyml-cli=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match energyml-cli version $crate"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `features: hdf5-static` builds HDF5 from its sources and links it in (CMake is on
          # every runner image): the archive reads arrays on a machine without HDF5. A target
          # without it still reads and writes packages, and refuses by name to read an
          # array (FeatureNotEnabled).
          # TODO(verify): HDF5 for the musl targets (built with cross).
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-22.04,     features: hdf5-static, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-24.04-arm, features: hdf5-static, ext: tar.gz }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-22.04,     features: "",          ext: tar.gz, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04,     features: "",          ext: tar.gz, musl: true }
          - { target: aarch64-apple-darwin,       os: macos-latest,     features: hdf5-static, ext: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-latest,     features: hdf5-static, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   features: hdf5-static, ext: zip }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest,   features: hdf5-static, ext: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (musl and foreign-architecture Linux targets)
        if: matrix.musl
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          feat=""
          if [ -n "${{ matrix.features }}" ]; then feat="--features ${{ matrix.features }}"; fi
          if [ "${{ matrix.musl }}" = "true" ]; then
            cross build --profile dist --locked -p energyml-cli --bin energyml --target ${{ matrix.target }} $feat
          else
            cargo build --profile dist --locked -p energyml-cli --bin energyml --target ${{ matrix.target }} $feat
          fi
      - name: Package
        shell: bash
        run: |
          name="energyml-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          bin=energyml
          if [ "${{ runner.os }}" = "Windows" ]; then bin=energyml.exe; fi
          cp "target/${{ matrix.target }}/dist/$bin" "$name/"
          cp LICENSE NOTICE README.md "$name/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Attaches every archive to the GitHub release of the tag.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # A published release keeps the notes its author wrote.
          generate_release_notes: ${{ github.event_name != 'release' }}
