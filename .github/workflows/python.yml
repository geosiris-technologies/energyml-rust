name: python

# Wheels and sdist for `energyml-rust` (imported as `energyml.rust`), built with
# maturin from crates/energyml-python.
#  - pull requests touching the bridge: one wheel + a smoke test;
#  - tag `python-v*`: the full matrix, sdist, and PyPI trusted publishing.
on:
  pull_request:
    paths:
      - "crates/energyml-python/**"
      - "crates/energyml-storage/**"
      - ".github/workflows/python.yml"
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

env:
  MANIFEST: crates/energyml-python/Cargo.toml

jobs:
  # A tag must name exactly the version the crate declares (version.workspace -> Cargo.toml).
  check-tag:
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag equals crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='energyml-python'))")
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag python-v$tag does not match energyml-python version $crate"
            exit 1
          fi

  # Pull requests: one Linux wheel, installed and exercised.
  test-wheel:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path ${{ env.MANIFEST }} --out dist
          manylinux: "2_28"
          # TODO(verify): HDF5 for the wheel (static build, plan §11.2); until then the system package.
          before-script-linux: yum install -y hdf5-devel cmake
      - name: Install the wheel and smoke-test it
        run: |
          pip install pytest numpy
          pip install --no-index --find-links dist energyml-rust
          python -c "from energyml.rust.epc import Epc; print(Epc)"
          python scripts/fetch-fixtures.py
          python -c "from energyml.rust.epc import Epc; p = Epc.open('target/fixtures/fesapi/testingPackageCpp22.epc'); assert len(p.objects()) > 0"
          # TODO(verify): run the Python test suite here once it is placed in the public tree.

  wheels:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: check-tag
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64,  manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-22.04,     target: x86_64,  manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest,     target: aarch64 }
          - { os: macos-latest,     target: x86_64 }
          - { os: windows-latest,   target: x64 }
          - { os: windows-latest,   target: aarch64 }  # TODO(verify): Windows arm64 is untested
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          # abi3-py39: one wheel per platform. auditwheel repair embeds HDF5 on Linux.
          args: --release --manifest-path ${{ env.MANIFEST }} --out dist --auditwheel repair
          # TODO(verify): HDF5 per target; musllinux and the aarch64 cross builds need a static HDF5 (plan §11.2).
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y hdf5-devel cmake; else apk add hdf5-dev cmake; fi
      # Windows and macOS wheels do not embed HDF5 by themselves.
      # TODO(verify): delvewheel (Windows, with `--namespace-pkg energyml`, so that the
      # loader preamble goes into energyml/rust/__init__.py and never into energyml/__init__.py)
      # and delocate (macOS) steps, then an import test in a clean venv.
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path ${{ env.MANIFEST }} --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  # PyPI trusted publishing (OIDC): no API token. The `pypi` environment and the
  # pending publisher are declared on PyPI for this repository and workflow.
  # Only from a python-v* tag, and only once publishing is switched on in the
  # repository's variables: creating the repository must not publish anything.
  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/python-v') && vars.PYPI_PUBLISH == 'true' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
