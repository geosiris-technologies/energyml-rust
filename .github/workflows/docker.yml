# The public image ghcr.io/geosiris-technologies/energyml, built and pushed by
# this repository's CI only - never from a workstation.
#
# - pull request: build for linux/amd64, smoke-test, push nothing;
# - push to main: push the `edge` tag;
# - a published release vX.Y.Z, or a tag energyml-cli-vX.Y.Z: push `X.Y.Z`, `X.Y`
#   and `latest` (`latest` not for a pre-release).
#
# Nothing is pushed until the repository variable IMAGE_PUBLISH is 'true': until
# then main, tags and manual runs only build and smoke-test, as a pull request does.
#
# Each architecture builds on its own native runner (emulating arm64 under QEMU
# would take hours for a Rust build), pushes by digest, and a last job joins the
# digests into one multi-architecture manifest.
name: docker

on:
  pull_request:
    paths: ["crates/**", "Cargo.*", "docker/**", "scripts/galaxy/**", ".github/workflows/docker.yml"]
  push:
    branches: [main]
    tags: ["energyml-cli-v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/geosiris-technologies/energyml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            lto: fat
          # The free arm64 runner lost the fat-LTO release build after 56 min (13/10/2026, no log
          # left: out of memory); a thin LTO keeps the build within it.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            lto: thin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The tag names the version of the code
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The tag must name the version of the code it builds: a release `vX.Y.Z` created on a
          # commit still at another version (14/10/2026: v0.1.2 on a main at 0.1.1) would
          # publish one version under the name of another. crates.io and PyPI refuse it; so here.
          crate=$(python3 - <<'EOF'
          import tomllib
          cli = tomllib.load(open("crates/energyml-cli/Cargo.toml", "rb"))["package"]["version"]
          if isinstance(cli, dict):
              cli = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(cli)
          EOF
          )
          tag="${GITHUB_REF_NAME#energyml-cli-}"
          tag="${tag#v}"
          echo "tag=$tag energyml-cli=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match energyml-cli version $crate"
            exit 1
          fi
      - name: Version
        id: v
        run: |
          case "$GITHUB_REF" in
            refs/tags/energyml-cli-v*) echo "version=${GITHUB_REF#refs/tags/energyml-cli-v}" >> "$GITHUB_OUTPUT" ;;
            refs/tags/v*) echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=edge" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build (and push by digest outside pull requests)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.v.outputs.version }}
            RELEASE_LTO=${{ matrix.lto }}
          load: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') }}
          tags: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') && 'energyml:test' || '' }}
          outputs: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test
        if: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') }}
        run: docker run --rm energyml:test --version
      - name: Export digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=match,pattern=energyml-cli-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=energyml-cli-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=^v(\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^v(\d+\.\d+)\.\d+$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/energyml-cli-v') || (github.event_name == 'release' && !github.event.release.prerelease) }}
      - name: Join the digests into one manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Smoke test the published image
        run: docker run --rm ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} --version
