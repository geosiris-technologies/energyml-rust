name: generated-guard

# crates/generated/ is written by the regeneration bot, never by hand.
# This check fails a pull request that touches it from any other author.
on:
  pull_request:
    paths:
      - "crates/generated/**"

permissions:
  contents: read
  # Which merged pull request each commit came from (the promotion of dev to main).
  pull-requests: read

env:
  # The login of the regeneration robot, a GitHub App (`<app-slug>[bot]`), set as
  # the repository variable REGENERATION_BOT. Unset, no pull request may change
  # generated code: the guard fails closed.
  REGENERATION_BOT: ${{ vars.REGENERATION_BOT }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject hand edits to generated code
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD" -- 'crates/generated/')
          # crates/generated/README.md is documentation, hand-written by maintainers.
          changed=$(echo "$changed" | grep -v '^crates/generated/README.md$' || true)
          # Release metadata is release-plz's, not the generator's: a crate's
          # CHANGELOG.md, and a Cargo.toml in which only `version = "…"` values
          # change (the release pull request bumps them).
          from=$(git merge-base "$BASE" "$HEAD")
          versionless() { sed -E 's/version = "[^"]*"/version = ""/g'; }
          kept=""
          for f in $changed; do
            case "$f" in
              */CHANGELOG.md) continue ;;
              */Cargo.toml)
                if before=$(git show "$from:$f" 2>/dev/null) && after=$(git show "$HEAD:$f" 2>/dev/null) \
                  && [ "$(versionless <<< "$before")" = "$(versionless <<< "$after")" ]; then
                  continue
                fi ;;
            esac
            kept="$kept$f"$'\n'
          done
          changed=$(printf '%s' "$kept")
          if [ -z "$changed" ]; then
            echo "No generated file changed beyond release metadata."
            exit 0
          fi
          if [ -n "$REGENERATION_BOT" ] && [ "$AUTHOR" = "$REGENERATION_BOT" ]; then
            echo "Generated files changed by the regeneration bot ($AUTHOR): allowed."
            exit 0
          fi
          # A pull request that promotes what was already merged (dev into main)
          # carries the bot's commits under another author. Accepted when every
          # commit touching these files came from a merged pull request opened by
          # the bot - asked of GitHub, never read from a commit's author line,
          # which anyone can write. One hand commit on them, and it is refused.
          if [ -n "$REGENERATION_BOT" ]; then
            commits=$(git log --format=%H "$from..$HEAD" -- $changed)
            from_the_bot=true
            for c in $commits; do
              by=$(gh api "repos/$REPO/commits/$c/pulls" \
                --jq "[.[] | select(.merged_at != null and .user.login == \"$REGENERATION_BOT\")] | length" \
                2>/dev/null || true)
              # Anything but a count above zero - none, or an API that failed - refuses.
              case "$by" in
                '' | 0 | *[!0-9]*)
                  echo "$c changes generated files and comes from no merged pull request of $REGENERATION_BOT"
                  from_the_bot=false ;;
              esac
            done
            if [ -n "$commits" ] && [ "$from_the_bot" = true ]; then
              echo "Generated files changed only by commits merged from $REGENERATION_BOT's pull requests: allowed."
              exit 0
            fi
          fi
          echo "::error::crates/generated/ is written by the regeneration bot only. Open an issue describing the defect instead of editing generated code."
          echo "$changed"
          exit 1
