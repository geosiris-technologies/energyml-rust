name: generated-guard

# crates/generated/ is written by the regeneration bot, never by hand.
# This check fails a pull request that touches it from any other author.
on:
  pull_request:
    paths:
      - "crates/generated/**"

permissions:
  contents: read

env:
  # TODO(verify): login of the regeneration bot account / GitHub App.
  REGENERATION_BOT: TODO-verify-bot-login

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject hand edits to generated code
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD" -- 'crates/generated/')
          # crates/generated/README.md is documentation, hand-written by maintainers.
          changed=$(echo "$changed" | grep -v '^crates/generated/README.md$' || true)
          if [ -z "$changed" ]; then
            echo "No generated file changed."
            exit 0
          fi
          if [ "$AUTHOR" = "$REGENERATION_BOT" ]; then
            echo "Generated files changed by the regeneration bot ($AUTHOR): allowed."
            exit 0
          fi
          echo "::error::crates/generated/ is written by the regeneration bot only. Open an issue describing the defect instead of editing generated code."
          echo "$changed"
          exit 1
